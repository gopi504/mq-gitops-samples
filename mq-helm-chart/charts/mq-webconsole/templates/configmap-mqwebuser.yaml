{{- if .Values.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mq-webconsole.fullname" . }}-mqwebuser
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mq-webconsole.labels" . | nindent 4 }}
data:
  mqwebuser.xml: |
    {{- include "mq-webconsole.mqwebuser.xml" . | nindent 4 }}
{{- end }}
