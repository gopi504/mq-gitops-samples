apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mqqmgr.fullname" . }}-dynamic-mqsc
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mqqmgr.labels" . | nindent 4 }}
data:
  dynamic.mqsc: |
    * Queues here are applied live — update this ConfigMap to add/change queues with no pod restart.
    {{- range .Values.dynamicQueues }}
    DEFINE QLOCAL({{ .name }}) REPLACE
    {{- end }}
